aid: dollar-shave
name: Dollar Shave
description: >-
  Dollar Shave Club is a direct-to-consumer men's grooming and personal-care
  brand founded in 2011 and acquired by Unilever in 2016, best known for
  pioneering the subscription razor model that ships blades, shave butter,
  skincare and body-care products to members on a recurring schedule. The
  company sells through its own e-commerce storefront (dollarshaveclub.com,
  built on Shopify) as well as retail channels, offering razor handles and
  cartridges, grooming kits and gift sets. It surfaces in the API Evangelist
  network as a portfolio company of Battery Ventures. Dollar Shave Club does not
  operate a public developer program or documented API; its digital surface is a
  consumer Shopify storefront whose only machine-discoverable interface is
  Shopify's customer-account OAuth/OIDC (including a customer-account MCP API
  scope) exposed at the store's /.well-known/ discovery endpoints.
